name: Compilation du projet Maven
on:
    push:
        branches:
            - main
    workflow_dispatch:
 
jobs:
    compilation:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Repository
              uses: actions/checkout@v5
            - name: Set up JDK 21
              uses: actions/setup-java@v5
              with:
                distribution: 'temurin'
                java-version: '25'
            - name: Fournir accès au runner
              run: chmod +x mvnw
            - name: Compilation projet Maven
              run: ./mvnw compile
 
            - name: Build and run tests
              run: ./mvnw -B clean verify
 
            - name: Publier le rapport de tests
              uses: actions/upload-artifact@v5
              with:
                name: jacoco
                path: target/site/jacoco/
            - name: Build
              run: ./mvnw -B clean package -DskipTests   # produit le .jar dans target/
         
            - name: Publier le .jar en artefact
              uses: actions/upload-artifact@v5
              with:
                name: application-jar
                path: target/*.jar          # ex. target/spring-petclinic-rest-*.jar