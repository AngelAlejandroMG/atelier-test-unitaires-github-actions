name: Compilation du projet Maven
on:
    push:
        branches:
            - main
    workflow_dispatch:
#Ma definition de job qui va sexecuter sur la branche...     
jobs:
    compilation:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v5
            - name: Set up JDK 25
              uses: actions/setup-java@v5
              with:
                distribution: 'temurin'
                java-version: '25'
            - name: Fournir access au runner
              run: chmod +x mvnw
            - name: Compilation du projet Maven
              run: ./mvnw compile

            - name: Build and run tests
              run: ./mvnw -B clean verify

            - name: Publier le rapport de tests                     # s'exécute même si les tests précédents ont échoué
              uses: actions/upload-artifact@v5
              with:
                name: jacoco
                path: target\site\jacoco

            - name:
              uses: actions/upload-artifact@v5
              with:
                name: application.jar
                path: target/*.jar