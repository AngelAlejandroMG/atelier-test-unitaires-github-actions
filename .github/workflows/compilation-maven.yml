name: Compilation du projet Maven
on:
    push:
        branches:
            - main
jobs:
    compilation:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v5
            - name: Set up JDK 25
              uses: actions/setup-java@v5
              with:
                distribution: 'temurin'
                java-version: '25'
            - name: Compilation du projet Maven
              run: ./mvnw compile